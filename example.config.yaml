# Base configuration for the documentation site
site:
  name: "Your Documentation Site"
  description: "Aggregated documentation from multiple repositories"
  base_url: "https://docs.your-domain.com"

# Submodule configurations
submodules:
  - name: "your-repo-1"
    url: "https://github.com/your-org/repo1.git"
    branch: "main"
    path: "submodules/repo1"

  - name: "your-repo-2"
    url: "https://github.com/your-org/repo2.git"
    branch: "main"
    path: "submodules/repo2"

# Build configuration
build:
  base_url: "https://devdocs.optimism.io"
  ga_tracking_id: "G-YNLYYEX7MN" # Google Analytics tracking ID
